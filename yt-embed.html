<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<!-- Referer bắt buộc — thiếu sẽ Error 153 trên GitHub Pages -->
<meta name="referrer" content="strict-origin-when-cross-origin"/>
<title>Phố An Lạc · YouTube</title>
<style>
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
  iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; display: block; }
  .err {
    color: #eee; font: 15px/1.45 system-ui, sans-serif; padding: 28px 18px;
    text-align: center;
  }
  .err a { color: #8ab4f8; }
</style>
</head>
<body>
<iframe
  id="yt"
  allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share; fullscreen"
  allowfullscreen
  referrerpolicy="strict-origin-when-cross-origin"
  title="YouTube"
></iframe>
<script>
(function () {
  const u = new URL(location.href);
  const v = String(u.searchParams.get('v') || '').trim();
  if (!/^[\w-]{11}$/.test(v)) {
    document.body.innerHTML = '<p class="err">Thiếu mã video YouTube.</p>';
    return;
  }
  const p = new URLSearchParams();
  p.set('autoplay', u.searchParams.get('autoplay') === '0' ? '0' : '1');
  p.set('rel', '0');
  p.set('modestbranding', '1');
  p.set('playsinline', '1');
  p.set('controls', u.searchParams.get('controls') === '0' ? '0' : '1');
  if (u.searchParams.get('mute') === '1') p.set('mute', '1');
  const start = parseInt(u.searchParams.get('start') || '0', 10);
  if (start > 0 && Number.isFinite(start)) p.set('start', String(start));
  // nocookie thường ít Error 153 hơn; ?host=www để thử youtube.com
  const host = u.searchParams.get('host') === 'www'
    ? 'www.youtube.com'
    : 'www.youtube-nocookie.com';
  const src = 'https://' + host + '/embed/' + encodeURIComponent(v) + '?' + p.toString();
  const frame = document.getElementById('yt');
  frame.src = src;
  frame.addEventListener('load', function () {
    /* no-op — giữ referrer từ trang này */
  });
})();
</script>
</body>
</html>
