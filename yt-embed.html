<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<meta name="referrer" content="strict-origin-when-cross-origin"/>
<title>Phố An Lạc · YouTube</title>
<style>
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
  iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; display: block; }
  .err { color: #eee; font: 15px/1.45 system-ui, sans-serif; padding: 28px 18px; text-align: center; }
  .err a { color: #8ab4f8; }
</style>
</head>
<body>
<iframe
  id="yt"
  allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share; fullscreen"
  allowfullscreen
  referrerpolicy="strict-origin-when-cross-origin"
  title="YouTube"
></iframe>
<script>
(function () {
  const u = new URL(location.href);
  const v = String(u.searchParams.get('v') || '').trim();
  if (!/^[\w-]{11}$/.test(v)) {
    document.body.innerHTML = '<p class="err">Thiếu mã video YouTube.</p>';
    return;
  }
  const mute = u.searchParams.get('mute') === '1';
  const start = parseInt(u.searchParams.get('start') || '0', 10) || 0;
  const wantAuto = u.searchParams.get('autoplay') !== '0';

  function buildSrc(host) {
    const p = new URLSearchParams();
    p.set('autoplay', wantAuto ? '1' : '0');
    p.set('rel', '0');
    p.set('modestbranding', '1');
    p.set('playsinline', '1');
    p.set('controls', '1');
    p.set('enablejsapi', '1');
    p.set('origin', location.origin);
    if (mute) p.set('mute', '1');
    if (start > 0) p.set('start', String(start));
    return 'https://' + host + '/embed/' + encodeURIComponent(v) + '?' + p.toString();
  }

  const frame = document.getElementById('yt');
  // Thử youtube.com trước (ổn định hơn một số máy), rồi nocookie
  const hosts = u.searchParams.get('host') === 'nocookie'
    ? ['www.youtube-nocookie.com', 'www.youtube.com']
    : ['www.youtube.com', 'www.youtube-nocookie.com'];

  let hostIdx = 0;
  function loadHost() {
    frame.src = buildSrc(hosts[hostIdx]);
  }
  loadHost();

  // Ép play sau khi load (cần cử chỉ người dùng từ trang chính)
  function forcePlay() {
    try {
      frame.contentWindow.postMessage(JSON.stringify({
        event: 'command', func: 'playVideo', args: []
      }), '*');
      if (!mute) {
        frame.contentWindow.postMessage(JSON.stringify({
          event: 'command', func: 'unMute', args: []
        }), '*');
        frame.contentWindow.postMessage(JSON.stringify({
          event: 'command', func: 'setVolume', args: [100]
        }), '*');
      }
    } catch (_) {}
  }
  frame.addEventListener('load', function () {
    setTimeout(forcePlay, 400);
    setTimeout(forcePlay, 1200);
  });

  function setVol(n) {
    const v = Math.max(0, Math.min(100, n | 0));
    try {
      frame.contentWindow.postMessage(JSON.stringify({
        event: 'command', func: 'setVolume', args: [v]
      }), '*');
    } catch (_) {}
  }

  // Parent: play / unmute / volume từ khoảng cách tới loa 3D
  window.addEventListener('message', function (ev) {
    if (!ev || ev.data == null) return;
    const d = ev.data;
    if (d === 'pho-play' || d === 'pho-unmute') {
      forcePlay();
      return;
    }
    if (typeof d === 'string' && d.indexOf('pho-volume:') === 0) {
      setVol(parseInt(d.slice(11), 10) || 0);
      return;
    }
    if (d && typeof d === 'object' && d.type === 'pho-volume') {
      setVol(d.value);
    }
  });
})();
</script>
</body>
</html>
